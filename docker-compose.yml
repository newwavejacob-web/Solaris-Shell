version: '3.8'

services:
  conch-shell:
    build: .
    image: conch-shell:latest
    container_name: conch-terminal
    stdin_open: true
    tty: true
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    environment:
      - TERM=xterm-256color
    networks:
      - conch-network

networks:
  conch-network:
    driver: bridge
